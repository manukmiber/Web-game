<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `user-scalable=no` because every gesture over this page belongs to the application. Pinch
      is how you zoom the 3D view; if the browser also reads it as page zoom, the scene zooms and
      the interface grows at the same time. `viewport-fit=cover` puts the canvas under a phone's
      rounded corners and notch rather than in a letterbox.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!--
      Inline rather than a file in `public/`, because the whole icon is three coloured axes and a
      data URI needs no request, no build step and no asset directory to exist for it. Without it
      the browser asks for `/favicon.ico` on every load and logs a 404 — a console with a
      permanent error in it is a console people stop reading.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2323262b'/%3E%3Cg stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M16 21 L26 26' stroke='%23f0736e'/%3E%3Cpath d='M16 21 L16 7' stroke='%236cc76c'/%3E%3Cpath d='M16 21 L6 26' stroke='%235aa2ff'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Web 3D Scene Editor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
