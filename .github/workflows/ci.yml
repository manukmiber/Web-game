name: CI

# Push covers the stable line only; everything else is covered by its pull request.
#
# Listing feature branches under `push` as well produced three identical runs for one commit:
# one for the branch push, one for the pull request, and one more for the release branch
# pointing at the same SHA. Release branches are markers on already-tested commits, so they
# need no run of their own.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` rather than `install` so the lockfile is what actually gets tested.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Catches anything that only breaks under a production build — the tests run through
      # Vitest's transform, which is not the same pipeline.
      - name: Build
        run: npm run build
